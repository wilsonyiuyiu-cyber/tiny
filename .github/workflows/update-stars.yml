name: Daily Cron Tasks

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分鐘執行一次
  workflow_dispatch: # 允許手動觸發

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Stars
        run: |
          curl "https://www.tinyhumansai.online/api/cron/sync-stars?key=SIUQWEHB210938142"
      
      - name: Import History
        run: |
          curl "https://www.tinyhumansai.online/api/cron/import-history?key=SIUQWEHB210938142"
